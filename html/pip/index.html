<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIP examples</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div id="background"></div>
  <div class="canvas-item is-playing drag-area-includes-size-controls" style="--base-x: -466px; --base-y: 0px;">
    <canvas class="tetrahedron-canvas" width="300" height="200"></canvas>
    <div class="canvas-controls">
      <button type="button" class="play-button">▶</button>
      <button type="button" class="pause-button">Ⅱ</button>
    </div>
    <div class="size-controls">
      <button type="button" class="grow-button">+</button>
      <button type="button" class="shrink-button">-</button>
    </div>
  </div>
  <div class="canvas-item is-playing" style="--base-x: -150px; --base-y: 28px;">
    <canvas class="tetrahedron-canvas" width="300" height="200"></canvas>
    <div class="canvas-controls">
      <button type="button" class="play-button">▶</button>
      <button type="button" class="pause-button">Ⅱ</button>
    </div>
    <div class="size-controls">
      <button type="button" class="grow-button">+</button>
      <button type="button" class="shrink-button">-</button>
    </div>
  </div>
  <div class="canvas-item is-playing hide-size-controls-while-dragging" style="--base-x: 166px; --base-y: 28px;">
    <canvas class="tetrahedron-canvas" width="300" height="200"></canvas>
    <div class="canvas-controls">
      <button type="button" class="play-button">▶</button>
      <button type="button" class="pause-button">Ⅱ</button>
    </div>
    <div class="size-controls">
      <button type="button" class="grow-button">+</button>
      <button type="button" class="shrink-button">-</button>
    </div>
  </div>
</body>
</html>
